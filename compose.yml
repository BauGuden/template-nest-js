name: nest-template

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-template-service}
      APP_MODE: ${APP_MODE:-hybrid}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      NATS_SERVERS: nats://nats:4222
      NATS_QUEUE: ${NATS_QUEUE:-template-service}
      DATABASE_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-template_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_LOGGING: ${DB_LOGGING:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--http_port", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-template_db}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
